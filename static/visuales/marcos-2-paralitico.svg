<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700" role="img" aria-labelledby="t d"><title id="t">El paralítico ante Jesús — Marcos 2:1–12</title><desc id="d">Secuencia del relato bíblico en cinco etapas.</desc><rect width="1200" height="1700" fill="#f7f5ed"/><rect x="52" y="52" width="1096" height="1596" rx="34" fill="#fffdf7" stroke="#c8d8c8" stroke-width="4"/><text x="110" y="150" fill="#38776d" font-family="sans-serif" font-size="30" font-weight="bold">BIBLIA VISUAL INTERACTIVA</text><text x="110" y="235" fill="#263f35" font-family="serif" font-size="67" font-weight="bold">El paralítico ante Jesús</text><text x="110" y="295" fill="#59756a" font-family="sans-serif" font-size="32">Marcos 2:1–12 · Secuencia del relato</text><line x1="160" y1="385" x2="160" y2="1410" stroke="#8cb4a5" stroke-width="12" stroke-linecap="round"/><circle cx="160" cy="405" r="50" fill="#397b70"/><text x="160" y="421" fill="white" font-family="sans-serif" font-size="45" text-anchor="middle" font-weight="bold">1</text><rect x="255" y="319" width="820" height="174" rx="24" fill="#eaf1e9"/><text x="290" y="377" font-family="sans-serif" font-size="35" font-weight="bold" fill="#29453b">Una casa llena</text><text x="290" y="425" font-family="sans-serif" font-size="25" fill="#355b4d">Jesús enseña y la multitud se reúne</text><text x="290" y="464" font-family="sans-serif" font-size="22" fill="#5e786c">Marcos 2:1–2</text><circle cx="160" cy="650" r="50" fill="#397b70"/><text x="160" y="666" fill="white" font-family="sans-serif" font-size="45" text-anchor="middle" font-weight="bold">2</text><rect x="255" y="564" width="820" height="174" rx="24" fill="#eaf1e9"/><text x="290" y="622" font-family="sans-serif" font-size="35" font-weight="bold" fill="#29453b">La fe en acción</text><text x="290" y="670" font-family="sans-serif" font-size="25" fill="#355b4d">Cuatro hombres acercan al paralítico</text><text x="290" y="709" font-family="sans-serif" font-size="22" fill="#5e786c">Marcos 2:3–5</text><circle cx="160" cy="895" r="50" fill="#397b70"/><text x="160" y="911" fill="white" font-family="sans-serif" font-size="45" text-anchor="middle" font-weight="bold">3</text><rect x="255" y="809" width="820" height="174" rx="24" fill="#eaf1e9"/><text x="290" y="867" font-family="sans-serif" font-size="35" font-weight="bold" fill="#29453b">El perdón declarado</text><text x="290" y="915" font-family="sans-serif" font-size="25" fill="#355b4d">Jesús dice: «Tus pecados te son perdonados»</text><text x="290" y="954" font-family="sans-serif" font-size="22" fill="#5e786c">Marcos 2:5</text><circle cx="160" cy="1140" r="50" fill="#397b70"/><text x="160" y="1156" fill="white" font-family="sans-serif" font-size="45" text-anchor="middle" font-weight="bold">4</text><rect x="255" y="1054" width="820" height="174" rx="24" fill="#eaf1e9"/><text x="290" y="1112" font-family="sans-serif" font-size="35" font-weight="bold" fill="#29453b">La pregunta de los escribas</text><text x="290" y="1160" font-family="sans-serif" font-size="25" fill="#355b4d">Se cuestiona la autoridad para perdonar</text><text x="290" y="1199" font-family="sans-serif" font-size="22" fill="#5e786c">Marcos 2:6–10</text><circle cx="160" cy="1385" r="50" fill="#397b70"/><text x="160" y="1401" fill="white" font-family="sans-serif" font-size="45" text-anchor="middle" font-weight="bold">5</text><rect x="255" y="1299" width="820" height="174" rx="24" fill="#eaf1e9"/><text x="290" y="1357" font-family="sans-serif" font-size="35" font-weight="bold" fill="#29453b">La sanidad visible</text><text x="290" y="1405" font-family="sans-serif" font-size="25" fill="#355b4d">El hombre se levanta ante todos</text><text x="290" y="1444" font-family="sans-serif" font-size="22" fill="#5e786c">Marcos 2:11–12</text><text x="110" y="1585" font-family="sans-serif" font-size="23" fill="#668073">Recurso piloto · Esquema literario, no reconstrucción histórica</text></svg>