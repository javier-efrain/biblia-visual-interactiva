name: Publicar BVI oficial y laboratorio

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar BVI oficial
        uses: actions/checkout@v4
        with:
          ref: main
          path: oficial

      - name: Descargar BVI laboratorio
        uses: actions/checkout@v4
        with:
          ref: develop
          path: laboratorio

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar y verificar oficial
        working-directory: oficial
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Instalar y verificar laboratorio
        working-directory: laboratorio
        env:
          BVI_BASE_PATH: /biblia-visual-interactiva/pruebas
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Incorporar laboratorio al sitio oficial
        run: |
          mkdir -p oficial/build/pruebas
          cp -a laboratorio/build/. oficial/build/pruebas/

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir ambas versiones
        uses: actions/upload-pages-artifact@v3
        with:
          path: oficial/build/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar BVI
        id: deployment
        uses: actions/deploy-pages@v4
